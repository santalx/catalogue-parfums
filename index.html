<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catalogue Parfums</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --black: #0a0a0a;
  --white: #ffffff;
  --off-white: #f8f7f5;
  --gray-100: #f0efed;
  --gray-200: #e2e0dc;
  --gray-400: #b0ada6;
  --gray-600: #6e6b64;
  --gray-800: #2e2c28;
  --serif: 'Cormorant Garamond', Georgia, serif;
  --sans: 'Inter', system-ui, sans-serif;
}

html { scroll-behavior: smooth; }

body {
  font-family: var(--sans);
  background: var(--off-white);
  color: var(--black);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

/* ── HEADER ── */
.site-header {
  position: sticky;
  top: 0;
  z-index: 200;
  background: rgba(248, 247, 245, 0.92);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--gray-200);
}

.header-inner {
  max-width: 1280px;
  margin: 0 auto;
  padding: 0 2.5rem;
  height: 68px;
  display: flex;
  align-items: center;
  gap: 2rem;
}

.logo {
  font-family: var(--serif);
  font-size: 22px;
  font-weight: 300;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--black);
  white-space: nowrap;
  flex-shrink: 0;
}

.logo span {
  font-style: italic;
  font-weight: 300;
}

.header-search {
  flex: 1;
  max-width: 380px;
  margin-left: auto;
  position: relative;
}

.header-search input {
  width: 100%;
  background: transparent;
  border: none;
  border-bottom: 1px solid var(--gray-400);
  padding: 6px 28px 6px 0;
  font-family: var(--sans);
  font-size: 13px;
  font-weight: 300;
  letter-spacing: 0.04em;
  color: var(--black);
  outline: none;
  transition: border-color 0.2s;
}

.header-search input::placeholder { color: var(--gray-400); }
.header-search input:focus { border-bottom-color: var(--black); }

.header-search svg {
  position: absolute;
  right: 0;
  top: 50%;
  transform: translateY(-50%);
  color: var(--gray-400);
  pointer-events: none;
}

/* ── HERO BAND ── */
.hero {
  background: var(--black);
  color: var(--white);
  text-align: center;
  padding: 4rem 2rem 3.5rem;
}

.hero-eyebrow {
  font-family: var(--sans);
  font-size: 10px;
  font-weight: 400;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  color: var(--gray-400);
  margin-bottom: 1rem;
}

.hero-title {
  font-family: var(--serif);
  font-size: clamp(42px, 6vw, 72px);
  font-weight: 300;
  letter-spacing: 0.04em;
  line-height: 1.05;
  color: var(--white);
}

.hero-title em {
  font-style: italic;
  font-weight: 300;
}

.hero-sub {
  font-family: var(--sans);
  font-size: 12px;
  font-weight: 300;
  letter-spacing: 0.1em;
  color: var(--gray-600);
  margin-top: 1.2rem;
}

/* ── CONTROLS ── */
.controls {
  max-width: 1280px;
  margin: 0 auto;
  padding: 2rem 2.5rem 0;
}

/* Filtre marques — scrollable horizontal */
.brand-bar {
  display: flex;
  gap: 0;
  overflow-x: auto;
  scrollbar-width: none;
  border-bottom: 1px solid var(--gray-200);
  margin-bottom: 0;
}
.brand-bar::-webkit-scrollbar { display: none; }

.brand-tab {
  font-family: var(--sans);
  font-size: 11px;
  font-weight: 400;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--gray-600);
  padding: 12px 20px;
  border: none;
  background: transparent;
  cursor: pointer;
  white-space: nowrap;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  transition: color 0.15s, border-color 0.15s;
}

.brand-tab:hover { color: var(--black); }
.brand-tab.active { color: var(--black); border-bottom-color: var(--black); }

/* Ligne filtres rapides */
.quick-filters {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 1.2rem 0;
  border-bottom: 1px solid var(--gray-200);
  flex-wrap: wrap;
}

.qf-btn {
  font-family: var(--sans);
  font-size: 11px;
  font-weight: 400;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--gray-600);
  padding: 5px 14px;
  border: 1px solid var(--gray-200);
  background: transparent;
  cursor: pointer;
  transition: all 0.15s;
}

.qf-btn:hover { border-color: var(--black); color: var(--black); }
.qf-btn.active { background: var(--black); color: var(--white); border-color: var(--black); }

.result-count {
  margin-left: auto;
  font-size: 11px;
  font-weight: 300;
  letter-spacing: 0.08em;
  color: var(--gray-400);
}

/* ── CATALOGUE PAR MARQUE ── */
.catalogue {
  max-width: 1280px;
  margin: 0 auto;
  padding: 0 2.5rem 6rem;
}

/* Section marque */
.brand-section {
  margin-top: 3.5rem;
}

.brand-section-header {
  display: flex;
  align-items: baseline;
  gap: 1.5rem;
  margin-bottom: 1.5rem;
  padding-bottom: 0.75rem;
  border-bottom: 1px solid var(--gray-200);
}

.brand-section-name {
  font-family: var(--serif);
  font-size: 28px;
  font-weight: 300;
  letter-spacing: 0.06em;
  color: var(--black);
}

.brand-section-count {
  font-size: 11px;
  font-weight: 300;
  letter-spacing: 0.08em;
  color: var(--gray-400);
}

/* Grille parfums */
.perfume-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 1px;
  background: var(--gray-200);
  border: 1px solid var(--gray-200);
}

/* Carte parfum */
.card {
  background: var(--white);
  cursor: default;
  transition: background 0.2s;
  position: relative;
}

.card:hover { background: var(--off-white); }
.card.epuise { opacity: 0.55; }

.card-img {
  width: 100%;
  aspect-ratio: 3/4;
  background: var(--gray-100);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  position: relative;
}

.card-img img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.4s ease;
}

.card:hover .card-img img { transform: scale(1.03); }

.card-img .no-photo {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  color: var(--gray-400);
}

.card-img .no-photo svg { opacity: 0.35; }

.card-img .no-photo span {
  font-size: 9px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
}

.epuise-overlay {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  background: rgba(10,10,10,0.72);
  color: var(--white);
  font-size: 9px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  text-align: center;
  padding: 7px;
}

.card-body {
  padding: 14px 16px 16px;
}

.card-nom {
  font-family: var(--serif);
  font-size: 17px;
  font-weight: 300;
  line-height: 1.25;
  color: var(--black);
  margin-bottom: 10px;
}

.card-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.card-prix {
  font-family: var(--sans);
  font-size: 14px;
  font-weight: 400;
  color: var(--black);
}

.card-vol {
  font-size: 11px;
  font-weight: 300;
  letter-spacing: 0.05em;
  color: var(--gray-400);
}

/* ── ÉTATS ── */
.loading-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 8rem 0;
  gap: 1.5rem;
  color: var(--gray-600);
}

.loading-line {
  width: 48px;
  height: 1px;
  background: var(--gray-200);
  position: relative;
  overflow: hidden;
}

.loading-line::after {
  content: '';
  position: absolute;
  left: -100%;
  top: 0;
  width: 100%;
  height: 100%;
  background: var(--black);
  animation: slide 1.2s ease-in-out infinite;
}

@keyframes slide {
  0% { left: -100%; }
  100% { left: 100%; }
}

.loading-state span {
  font-size: 11px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  font-weight: 300;
}

.empty-state {
  text-align: center;
  padding: 6rem 0;
  color: var(--gray-400);
  font-size: 13px;
  letter-spacing: 0.08em;
}

.error-state {
  max-width: 480px;
  margin: 4rem auto;
  text-align: center;
  padding: 2.5rem;
  border: 1px solid var(--gray-200);
  background: var(--white);
}

.error-state p {
  font-family: var(--serif);
  font-size: 20px;
  font-weight: 300;
  margin-bottom: 0.75rem;
}

.error-state small {
  font-size: 12px;
  font-weight: 300;
  color: var(--gray-600);
  letter-spacing: 0.04em;
}

/* ── RESPONSIVE ── */
@media (max-width: 768px) {
  .header-inner { padding: 0 1.25rem; height: 58px; }
  .logo { font-size: 17px; }
  .controls { padding: 1.5rem 1.25rem 0; }
  .catalogue { padding: 0 1.25rem 4rem; }
  .hero { padding: 3rem 1.5rem 2.5rem; }
  .brand-tab { padding: 10px 14px; font-size: 10px; }
  .perfume-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
  .brand-section-name { font-size: 22px; }
}

@media (prefers-reduced-motion: reduce) {
  .card-img img, .loading-line::after { animation: none; transition: none; }
}
</style>
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <div class="logo">Collection <span>Privée</span></div>
    <div class="header-search">
      <input type="text" id="search" placeholder="Rechercher…" autocomplete="off" spellcheck="false">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    </div>
  </div>
</header>

<section class="hero">
  <p class="hero-eyebrow">Sélection exclusive · Grenoble</p>
  <h1 class="hero-title">Parfums <em>rares</em></h1>
  <p class="hero-sub">Prix négociés · Sous blister disponible · Mise à jour quotidienne</p>
</section>

<div class="controls">
  <div class="brand-bar" id="brand-bar">
    <button class="brand-tab active" data-brand="tous">Toutes les maisons</button>
  </div>
  <div class="quick-filters">
    <button class="qf-btn active" data-qf="tous">Tous</button>
    <button class="qf-btn" data-qf="dispo">Disponibles</button>
    <button class="qf-btn" data-qf="blister">Sous blister</button>
    <button class="qf-btn" data-qf="Homme">Homme</button>
    <button class="qf-btn" data-qf="Femme">Femme</button>
    <button class="qf-btn" data-qf="Mixte">Mixte</button>
    <span class="result-count" id="result-count"></span>
  </div>
</div>

<div class="catalogue" id="catalogue">
  <div class="loading-state" id="loading">
    <div class="loading-line"></div>
    <span>Chargement du catalogue</span>
  </div>
</div>

<script>
const SHEET_ID   = '1oHOoJghOo-IJjeDoQsb10LXgV45n_ULxMN82PdX1j54';
const SHEET_NAME = 'Catalogue_Parfums';

// Colonnes attendues dans le Sheet (dans l'ordre) :
// A=Nom  B=Marque  C=Prix  D=Volume  E=Disponible  F=Genre  G=Photo  H=Blister

let allData = [];
let activeBrand = 'tous';
let activeQF    = 'tous';
let searchQuery = '';

/* ── CHARGEMENT ── */
async function loadData() {
  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(SHEET_NAME)}`;
  try {
    const res  = await fetch(url);
    const text = await res.text();
    const json = JSON.parse(text.substring(47, text.length - 2));

    allData = json.table.rows
      .filter(r => r.c[0]?.v)
      .map(r => ({
        nom:     String(r.c[0]?.v || '').trim(),
        marque:  String(r.c[1]?.v || '').trim(),
        prix:    r.c[2]?.v ?? '',
        volume:  String(r.c[3]?.v || '').trim(),
        dispo:   String(r.c[4]?.v || '').trim(),
        genre:   String(r.c[5]?.v || '').trim(),
        photo:   String(r.c[6]?.v || '').trim(),
        blister: String(r.c[7]?.v || '').trim(),
      }));

    buildBrandTabs();
    render();
  } catch(e) {
    document.getElementById('loading').outerHTML = `
      <div class="error-state">
        <p>Catalogue indisponible</p>
        <small>Vérifiez que le Google Sheet est partagé en lecture publique.</small>
      </div>`;
  }
}

function isDispo(val) {
  return ['oui','yes','true','1','dispo','disponible'].includes((val||'').toLowerCase());
}

function isBlister(val) {
  return ['oui','yes','true','1'].includes((val||'').toLowerCase());
}

/* ── ONGLETS MARQUES ── */
function buildBrandTabs() {
  const brands = [...new Set(allData.map(p => p.marque))].filter(Boolean).sort();
  const bar = document.getElementById('brand-bar');
  brands.forEach(b => {
    const btn = document.createElement('button');
    btn.className = 'brand-tab';
    btn.dataset.brand = b;
    btn.textContent = b;
    bar.appendChild(btn);
  });
  bar.addEventListener('click', e => {
    const btn = e.target.closest('.brand-tab');
    if (!btn) return;
    document.querySelectorAll('.brand-tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    activeBrand = btn.dataset.brand;
    render();
    // Scroll smooth vers la section si marque précise
    if (activeBrand !== 'tous') {
      const sec = document.getElementById('brand-' + CSS.escape(activeBrand));
      if (sec) sec.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
  });
}

/* ── RENDU ── */
function render() {
  const cat = document.getElementById('catalogue');

  // Filtre
  let filtered = allData.filter(p => {
    if (activeBrand !== 'tous' && p.marque !== activeBrand) return false;
    if (activeQF === 'dispo'   && !isDispo(p.dispo))  return false;
    if (activeQF === 'blister' && !isBlister(p.blister)) return false;
    if (activeQF === 'Homme'   && p.genre !== 'Homme')   return false;
    if (activeQF === 'Femme'   && p.genre !== 'Femme')   return false;
    if (activeQF === 'Mixte'   && p.genre !== 'Mixte')   return false;
    if (searchQuery) {
      const q = searchQuery.toLowerCase();
      if (!p.nom.toLowerCase().includes(q) && !p.marque.toLowerCase().includes(q)) return false;
    }
    return true;
  });

  document.getElementById('result-count').textContent =
    filtered.length + ' parfum' + (filtered.length > 1 ? 's' : '');

  if (filtered.length === 0) {
    cat.innerHTML = '<p class="empty-state">Aucun résultat</p>';
    return;
  }

  // Grouper par marque
  const groups = {};
  filtered.forEach(p => {
    if (!groups[p.marque]) groups[p.marque] = [];
    groups[p.marque].push(p);
  });

  cat.innerHTML = Object.entries(groups).map(([brand, items]) => `
    <section class="brand-section" id="brand-${brand}">
      <div class="brand-section-header">
        <h2 class="brand-section-name">${brand}</h2>
        <span class="brand-section-count">${items.length} référence${items.length > 1 ? 's' : ''}</span>
      </div>
      <div class="perfume-grid">
        ${items.map(cardHTML).join('')}
      </div>
    </section>
  `).join('');
}

function cardHTML(p) {
  const dispo = isDispo(p.dispo);
  const prix  = p.prix !== '' ? Number(p.prix).toLocaleString('fr-FR') + '\u202f€' : '—';
  const imgContent = p.photo
    ? `<img src="${p.photo}" alt="${p.nom}" loading="lazy"
        onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`
    : '';

  return `
    <div class="card${dispo ? '' : ' epuise'}">
      <div class="card-img">
        ${imgContent}
        <div class="no-photo" style="${p.photo ? 'display:none' : ''}">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
            <rect x="3" y="3" width="18" height="18" rx="1"/>
            <circle cx="8.5" cy="8.5" r="1.5"/>
            <polyline points="21 15 16 10 5 21"/>
          </svg>
          <span>Photo à venir</span>
        </div>
        ${!dispo ? '<div class="epuise-overlay">Épuisé</div>' : ''}
      </div>
      <div class="card-body">
        <p class="card-nom">${p.nom}</p>
        <div class="card-meta">
          <span class="card-prix">${prix}</span>
          <span class="card-vol">${p.volume}</span>
        </div>
      </div>
    </div>`;
}

/* ── EVENTS ── */
document.querySelectorAll('.qf-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.qf-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeQF = btn.dataset.qf;
    render();
  });
});

document.getElementById('search').addEventListener('input', e => {
  searchQuery = e.target.value.trim();
  // Réinitialise le filtre marque si on cherche
  if (searchQuery) {
    activeBrand = 'tous';
    document.querySelectorAll('.brand-tab').forEach(t => t.classList.remove('active'));
    document.querySelector('.brand-tab[data-brand="tous"]').classList.add('active');
  }
  render();
});

loadData();
</script>
</body>
</html>
