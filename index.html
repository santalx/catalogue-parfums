<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Santalx — Catalogue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --black: #0a0a0a;
  --white: #ffffff;
  --off-white: #f7f6f4;
  --gray-100: #f0efed;
  --gray-200: #e2e0dc;
  --gray-400: #b0ada6;
  --gray-600: #6e6b64;
}

html { scroll-behavior: smooth; }

body {
  font-family: 'Montserrat', system-ui, sans-serif;
  background: var(--off-white);
  color: var(--black);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

/* ── HEADER ── */
.site-header {
  position: sticky;
  top: 0;
  z-index: 200;
  background: rgba(247,246,244,0.94);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--gray-200);
}

.header-inner {
  max-width: 1280px;
  margin: 0 auto;
  padding: 0 2.5rem;
  height: 64px;
  display: flex;
  align-items: center;
  gap: 2rem;
}

.logo {
  font-family: 'Cormorant Garamond', serif;
  font-size: 22px;
  font-weight: 400;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--black);
  white-space: nowrap;
  flex-shrink: 0;
}

.header-search {
  flex: 1;
  max-width: 340px;
  margin-left: auto;
  position: relative;
}

.header-search input {
  width: 100%;
  background: transparent;
  border: none;
  border-bottom: 1px solid var(--gray-400);
  padding: 6px 26px 6px 0;
  font-family: 'Montserrat', sans-serif;
  font-size: 12px;
  font-weight: 300;
  letter-spacing: 0.06em;
  color: var(--black);
  outline: none;
  transition: border-color 0.2s;
}

.header-search input::placeholder { color: var(--gray-400); }
.header-search input:focus { border-bottom-color: var(--black); }

.header-search svg {
  position: absolute;
  right: 0; top: 50%;
  transform: translateY(-50%);
  color: var(--gray-400);
  pointer-events: none;
}

/* ── HERO ── */
.hero {
  background: var(--black);
  color: var(--white);
  text-align: center;
  padding: 5rem 2rem 4.5rem;
}

.hero-eyebrow {
  font-family: 'Montserrat', sans-serif;
  font-size: 9px;
  font-weight: 400;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--gray-400);
  margin-bottom: 1.4rem;
}

.hero-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(44px, 6vw, 76px);
  font-weight: 300;
  font-style: italic;
  letter-spacing: 0.06em;
  line-height: 1.05;
  color: var(--white);
}

/* ── BEST SELLERS ── */
.bestsellers-section {
  max-width: 1280px;
  margin: 3.5rem auto 0;
  padding: 0 2.5rem;
}

.section-eyebrow {
  font-family: 'Montserrat', sans-serif;
  font-size: 9px;
  font-weight: 500;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  color: var(--gray-400);
  margin-bottom: 1.5rem;
}

.bs-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1px;
  background: var(--gray-200);
  border: 1px solid var(--gray-200);
  margin-bottom: 4rem;
}

.bs-card {
  background: var(--white);
  position: relative;
}

.bs-badge {
  position: absolute;
  top: 12px;
  left: 12px;
  z-index: 2;
  font-family: 'Montserrat', sans-serif;
  font-size: 8px;
  font-weight: 500;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  background: var(--black);
  color: var(--white);
  padding: 4px 10px;
}

.bs-img {
  width: 100%;
  aspect-ratio: 3/4;
  background: var(--gray-100);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.bs-img img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.45s ease;
}

.bs-card:hover .bs-img img { transform: scale(1.03); }

.bs-body {
  padding: 14px 16px 18px;
  border-top: 1px solid var(--gray-200);
}

.bs-marque {
  font-size: 9px;
  font-weight: 500;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--gray-400);
  margin-bottom: 5px;
}

.bs-nom {
  font-family: 'Cormorant Garamond', serif;
  font-size: 20px;
  font-weight: 400;
  letter-spacing: 0.03em;
  color: var(--black);
  margin-bottom: 10px;
  line-height: 1.2;
}

.bs-meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.bs-prix {
  font-size: 14px;
  font-weight: 500;
  color: var(--black);
}

.bs-vol {
  font-size: 10px;
  font-weight: 300;
  color: var(--gray-400);
  letter-spacing: 0.05em;
}

/* ── SÉPARATEUR ── */
.sep {
  max-width: 1280px;
  margin: 0 auto 3.5rem;
  padding: 0 2.5rem;
  border-bottom: 1px solid var(--gray-200);
}

/* ── VUE MAISONS ── */
#view-maisons { display: block; }
#view-catalogue { display: none; }

.maisons-wrap {
  max-width: 1280px;
  margin: 0 auto;
  padding: 0 2.5rem 6rem;
}

.brands-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
  gap: 1px;
  background: var(--gray-200);
  border: 1px solid var(--gray-200);
}

.brand-card {
  background: var(--white);
  padding: 0;
  cursor: pointer;
  transition: background 0.18s;
  display: flex;
  flex-direction: column;
  border: none;
  text-align: left;
  overflow: hidden;
}

.brand-card:hover { background: var(--black); }
.brand-card:hover .bc-name,
.brand-card:hover .bc-count { color: var(--white); }
.brand-card:hover .bc-img-wrap { filter: invert(1); }

.bc-img-wrap {
  width: 100%;
  height: 140px;
  background: var(--white);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 1.25rem;
  transition: filter 0.18s;
  overflow: hidden;
}

.bc-img-wrap img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.bc-no-logo {
  font-family: 'Cormorant Garamond', serif;
  font-size: 18px;
  font-weight: 400;
  letter-spacing: 0.1em;
  color: var(--gray-400);
  text-align: center;
}

.bc-body {
  padding: 14px 16px 16px;
  border-top: 1px solid var(--gray-200);
}

.bc-name {
  font-family: 'Montserrat', sans-serif;
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--black);
  transition: color 0.18s;
  margin-bottom: 4px;
}

.bc-count {
  font-size: 10px;
  font-weight: 300;
  letter-spacing: 0.06em;
  color: var(--gray-400);
  transition: color 0.18s;
}

/* ── VUE CATALOGUE ── */
.cat-header {
  max-width: 1280px;
  margin: 0 auto;
  padding: 1.75rem 2.5rem 1.25rem;
  display: flex;
  align-items: center;
  gap: 1.5rem;
  border-bottom: 1px solid var(--gray-200);
}

.back-btn {
  font-family: 'Montserrat', sans-serif;
  font-size: 10px;
  font-weight: 400;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--gray-600);
  background: none;
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 0;
  transition: color 0.15s;
}

.back-btn:hover { color: var(--black); }

.cat-brand-name {
  font-family: 'Cormorant Garamond', serif;
  font-size: 20px;
  font-weight: 400;
  letter-spacing: 0.1em;
  color: var(--black);
}

.cat-controls {
  max-width: 1280px;
  margin: 0 auto;
  padding: 1rem 2.5rem;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  border-bottom: 1px solid var(--gray-200);
}

.qf-btn {
  font-family: 'Montserrat', sans-serif;
  font-size: 10px;
  font-weight: 400;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--gray-600);
  padding: 5px 14px;
  border: 1px solid var(--gray-200);
  background: transparent;
  cursor: pointer;
  transition: all 0.15s;
}

.qf-btn:hover { border-color: var(--black); color: var(--black); }
.qf-btn.active { background: var(--black); color: var(--white); border-color: var(--black); }

.result-count {
  margin-left: auto;
  font-size: 10px;
  font-weight: 300;
  letter-spacing: 0.1em;
  color: var(--gray-400);
}

.catalogue {
  max-width: 1280px;
  margin: 0 auto;
  padding: 0 2.5rem 6rem;
}

.perfume-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 1px;
  background: var(--gray-200);
  border: 1px solid var(--gray-200);
  margin-top: 2rem;
}

.card {
  background: var(--white);
  transition: background 0.2s;
  position: relative;
}

.card:hover { background: var(--off-white); }
.card.epuise { opacity: 0.5; }

.card-img {
  width: 100%;
  aspect-ratio: 3/4;
  background: var(--gray-100);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  position: relative;
}

.card-img img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.45s ease;
}

.card:hover .card-img img { transform: scale(1.04); }

.no-photo {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  color: var(--gray-400);
}

.no-photo svg { opacity: 0.3; }

.no-photo span {
  font-size: 8px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  font-weight: 300;
}

.epuise-overlay {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  background: rgba(10,10,10,0.75);
  color: var(--white);
  font-size: 8px;
  font-weight: 400;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  text-align: center;
  padding: 8px;
}

.card-body { padding: 14px 16px 16px; }

.card-nom {
  font-family: 'Cormorant Garamond', serif;
  font-size: 18px;
  font-weight: 400;
  letter-spacing: 0.02em;
  line-height: 1.3;
  color: var(--black);
  margin-bottom: 10px;
}

.card-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.card-prix { font-size: 13px; font-weight: 500; color: var(--black); }
.card-vol { font-size: 10px; font-weight: 300; letter-spacing: 0.06em; color: var(--gray-400); }

/* ── ÉTATS ── */
.loading-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 6rem 0;
  gap: 1.5rem;
}

.loading-line {
  width: 48px; height: 1px;
  background: var(--gray-200);
  position: relative;
  overflow: hidden;
}

.loading-line::after {
  content: '';
  position: absolute;
  left: -100%; top: 0;
  width: 100%; height: 100%;
  background: var(--black);
  animation: slide 1.2s ease-in-out infinite;
}

@keyframes slide { 0% { left:-100%; } 100% { left:100%; } }

.loading-state span {
  font-size: 9px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  font-weight: 300;
  color: var(--gray-600);
}

.empty-state {
  text-align: center; padding: 5rem 0;
  font-size: 11px; letter-spacing: 0.1em; color: var(--gray-400);
  grid-column: 1/-1;
}

.error-state {
  max-width: 420px; margin: 5rem auto;
  text-align: center; padding: 2.5rem;
  border: 1px solid var(--gray-200); background: var(--white);
}

.error-state p { font-size: 14px; font-weight: 300; margin-bottom: .75rem; }
.error-state small { font-size: 11px; font-weight: 300; color: var(--gray-600); letter-spacing: .04em; }

/* ── RESPONSIVE ── */
@media (max-width: 768px) {
  .header-inner { padding: 0 1.25rem; height: 56px; }
  .bestsellers-section, .maisons-wrap, .catalogue, .sep { padding-left: 1.25rem; padding-right: 1.25rem; }
  .cat-header, .cat-controls { padding-left: 1.25rem; padding-right: 1.25rem; }
  .bs-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
  .brands-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
  .perfume-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
  .hero { padding: 3.5rem 1.5rem 3rem; }
}

@media (prefers-reduced-motion: reduce) {
  .card-img img, .bs-img img, .loading-line::after { animation: none; transition: none; }
}
</style>
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <div class="logo">Santalx</div>
    <div class="header-search">
      <input type="text" id="search" placeholder="Rechercher…" autocomplete="off" spellcheck="false">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    </div>
  </div>
</header>

<section class="hero">
  <p class="hero-eyebrow">Sélection exclusive</p>
  <h1 class="hero-title">Notre sélection de parfums exclusifs</h1>
</section>

<!-- VUE MAISONS -->
<div id="view-maisons">
  <div class="bestsellers-section" id="bs-section" style="display:none">
    <p class="section-eyebrow">Best-sellers</p>
    <div class="bs-grid" id="bs-grid"></div>
  </div>
  <div class="sep"></div>
  <div class="maisons-wrap">
    <p class="section-eyebrow" id="maisons-label">Chargement…</p>
    <div class="brands-grid" id="brands-grid">
      <div class="loading-state" style="grid-column:1/-1">
        <div class="loading-line"></div>
        <span>Chargement</span>
      </div>
    </div>
  </div>
</div>

<!-- VUE CATALOGUE -->
<div id="view-catalogue">
  <div class="cat-header">
    <button class="back-btn" id="back-btn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="m15 18-6-6 6-6"/></svg>
      Toutes les maisons
    </button>
    <span class="cat-brand-name" id="cat-brand-name"></span>
  </div>
  <div class="cat-controls">
    <button class="qf-btn active" data-qf="tous">Tous</button>
    <button class="qf-btn" data-qf="dispo">Disponibles</button>
    <button class="qf-btn" data-qf="Homme">Homme</button>
    <button class="qf-btn" data-qf="Femme">Femme</button>
    <button class="qf-btn" data-qf="Mixte">Mixte</button>
    <span class="result-count" id="result-count"></span>
  </div>
  <div class="catalogue">
    <div class="perfume-grid" id="perfume-grid"></div>
  </div>
</div>

<script>
const SHEET_ID   = '1oHOoJghOo-IJjeDoQsb10LXgV45n_ULxMN82PdX1j54';
const SHEET_NAME = 'Catalogue_Parfums';

// Colonnes Sheet :
// A=Nom  B=Marque  C=Prix  D=Volume  E=Disponible  F=Genre  G=Photo  H=Logo_Marque  I=Best_Seller

let allData     = [];
let brandLogos  = {};
let activeBrand = null;
let activeQF    = 'tous';
let searchQuery = '';

async function loadData() {
  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(SHEET_NAME)}`;
  try {
    const res  = await fetch(url);
    const text = await res.text();
    const json = JSON.parse(text.substring(47, text.length - 2));

    allData = json.table.rows
      .filter(r => r.c[0]?.v)
      .map(r => ({
        nom:        String(r.c[0]?.v || '').trim(),
        marque:     String(r.c[1]?.v || '').trim(),
        prix:       r.c[2]?.v ?? '',
        volume:     String(r.c[3]?.v || '').trim(),
        dispo:      String(r.c[4]?.v || '').trim(),
        genre:      String(r.c[5]?.v || '').trim(),
        photo:      String(r.c[6]?.v || '').trim(),
        logo:       String(r.c[7]?.v || '').trim(),
        bestSeller: String(r.c[8]?.v || '').trim(),
      }));

    // Logo par marque : on garde le dernier renseigné
    allData.forEach(p => { if (p.logo) brandLogos[p.marque] = p.logo; });

    buildMaisons();
    buildBestSellers();
  } catch(e) {
    document.getElementById('brands-grid').innerHTML =
      `<div class="error-state" style="grid-column:1/-1">
        <p>Catalogue indisponible</p>
        <small>Vérifiez que le Google Sheet est partagé en lecture publique.</small>
      </div>`;
    document.getElementById('maisons-label').textContent = '';
  }
}

function isDispo(val) {
  return ['oui','yes','true','1','dispo','disponible'].includes((val||'').toLowerCase());
}

/* ── BEST SELLERS ── */
function buildBestSellers() {
  const bs = allData.filter(p =>
    ['oui','yes','true','1'].includes((p.bestSeller||'').toLowerCase())
  ).slice(0, 3);

  if (bs.length === 0) return;

  const section = document.getElementById('bs-section');
  const grid    = document.getElementById('bs-grid');
  section.style.display = 'block';

  grid.innerHTML = bs.map(p => {
    const prix = p.prix !== '' ? Number(p.prix).toLocaleString('fr-FR') + '\u202f€' : '—';
    const imgContent = p.photo
      ? `<img src="${p.photo}" alt="${p.nom}" loading="lazy">`
      : `<div style="color:var(--gray-400);font-size:11px;letter-spacing:.1em;font-weight:300">Photo à venir</div>`;
    return `
      <div class="bs-card">
        <div class="bs-badge">Best-seller</div>
        <div class="bs-img">${imgContent}</div>
        <div class="bs-body">
          <p class="bs-marque">${p.marque}</p>
          <p class="bs-nom">${p.nom}</p>
          <div class="bs-meta">
            <span class="bs-prix">${prix}</span>
            <span class="bs-vol">${p.volume}</span>
          </div>
        </div>
      </div>`;
  }).join('');
}

/* ── VUE MAISONS ── */
function buildMaisons() {
  const counts = {};
  allData.forEach(p => { counts[p.marque] = (counts[p.marque] || 0) + 1; });
  const brands = Object.keys(counts).filter(Boolean).sort();

  document.getElementById('maisons-label').textContent = brands.length + ' maisons';

  const grid = document.getElementById('brands-grid');
  grid.innerHTML = brands.map(b => {
    const logo = brandLogos[b];
    const imgBlock = logo
      ? `<img src="${logo}" alt="${b}" loading="lazy">`
      : `<span class="bc-no-logo">${b.substring(0,2).toUpperCase()}</span>`;
    return `
      <button class="brand-card" data-brand="${b}">
        <div class="bc-img-wrap">${imgBlock}</div>
        <div class="bc-body">
          <p class="bc-name">${b}</p>
          <p class="bc-count">${counts[b]} référence${counts[b] > 1 ? 's' : ''}</p>
        </div>
      </button>`;
  }).join('');

  grid.addEventListener('click', e => {
    const btn = e.target.closest('.brand-card');
    if (!btn) return;
    selectBrand(btn.dataset.brand);
  });
}

/* ── NAVIGATION ── */
function selectBrand(brand) {
  activeBrand = brand;
  activeQF = 'tous';
  document.querySelectorAll('.qf-btn').forEach(b => b.classList.remove('active'));
  document.querySelector('.qf-btn[data-qf="tous"]').classList.add('active');
  document.getElementById('cat-brand-name').textContent = brand;
  document.getElementById('view-maisons').style.display = 'none';
  document.getElementById('view-catalogue').style.display = 'block';
  renderCatalogue();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function goBack() {
  activeBrand = null;
  searchQuery = '';
  document.getElementById('search').value = '';
  document.getElementById('view-catalogue').style.display = 'none';
  document.getElementById('view-maisons').style.display = 'block';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

document.getElementById('back-btn').addEventListener('click', goBack);

/* ── RENDU CATALOGUE ── */
function renderCatalogue() {
  const grid = document.getElementById('perfume-grid');

  let filtered = allData.filter(p => {
    if (activeBrand && p.marque !== activeBrand) return false;
    if (activeQF === 'dispo' && !isDispo(p.dispo)) return false;
    if (activeQF === 'Homme' && p.genre !== 'Homme') return false;
    if (activeQF === 'Femme' && p.genre !== 'Femme') return false;
    if (activeQF === 'Mixte' && p.genre !== 'Mixte') return false;
    if (searchQuery) {
      const q = searchQuery.toLowerCase();
      if (!p.nom.toLowerCase().includes(q) && !p.marque.toLowerCase().includes(q)) return false;
    }
    return true;
  });

  const n = filtered.length;
  document.getElementById('result-count').textContent = n + ' parfum' + (n > 1 ? 's' : '');

  if (n === 0) {
    grid.innerHTML = '<p class="empty-state">Aucun résultat</p>';
    return;
  }

  grid.innerHTML = filtered.map(p => {
    const dispo = isDispo(p.dispo);
    const prix  = p.prix !== '' ? Number(p.prix).toLocaleString('fr-FR') + '\u202f€' : '—';
    const imgContent = p.photo
      ? `<img src="${p.photo}" alt="${p.nom}" loading="lazy"
          onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`
      : '';
    return `
      <div class="card${dispo ? '' : ' epuise'}">
        <div class="card-img">
          ${imgContent}
          <div class="no-photo" style="${p.photo ? 'display:none' : ''}">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
              <rect x="3" y="3" width="18" height="18" rx="1"/>
              <circle cx="8.5" cy="8.5" r="1.5"/>
              <polyline points="21 15 16 10 5 21"/>
            </svg>
            <span>Photo à venir</span>
          </div>
          ${!dispo ? '<div class="epuise-overlay">Épuisé</div>' : ''}
        </div>
        <div class="card-body">
          <p class="card-nom">${p.nom}</p>
          <div class="card-meta">
            <span class="card-prix">${prix}</span>
            <span class="card-vol">${p.volume}</span>
          </div>
        </div>
      </div>`;
  }).join('');
}

document.querySelectorAll('.qf-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.qf-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeQF = btn.dataset.qf;
    renderCatalogue();
  });
});

document.getElementById('search').addEventListener('input', e => {
  searchQuery = e.target.value.trim();
  if (searchQuery) {
    activeBrand = null;
    document.getElementById('cat-brand-name').textContent = 'Résultats';
    document.getElementById('view-maisons').style.display = 'none';
    document.getElementById('view-catalogue').style.display = 'block';
    activeQF = 'tous';
    document.querySelectorAll('.qf-btn').forEach(b => b.classList.remove('active'));
    document.querySelector('.qf-btn[data-qf="tous"]').classList.add('active');
    renderCatalogue();
  } else {
    goBack();
  }
});

loadData();
</script>
